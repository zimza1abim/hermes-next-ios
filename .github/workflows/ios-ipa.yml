name: Unsigned iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test HermesVoiceCore
        run: swift test --package-path HermesVoiceCore

      - name: Unsigned Release build
        run: |
          xcodebuild \
            -project HermesNext.xcodeproj \
            -scheme HermesNext \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/derived/Build/Products" -name 'HermesNext.app' -type d | head -n 1)"
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HermesNext-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HermesNext-unsigned
          path: HermesNext-unsigned.ipa
          if-no-files-found: error
